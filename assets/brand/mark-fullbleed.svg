<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- Full-bleed tile for Apple touch icons and maskable PWA icons: the platform rounds the corners.
       The waveform sits inside the 80% safe zone so circular masks never clip it. -->
  <rect width="1024" height="1024" fill="#5856D6"/>
  <g fill="#FFFFFF" transform="translate(512 512) scale(32) translate(-14 -14)">
    <rect x="6" y="9" width="2.5" height="10" rx="1.25"/>
    <rect x="10.5" y="6.5" width="2.5" height="15" rx="1.25"/>
    <rect x="15" y="10" width="2.5" height="8" rx="1.25"/>
    <rect x="19.5" y="12" width="2.5" height="4" rx="1.25"/>
  </g>
</svg>
