name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On pull requests from this repo: regenerate pnpm-lock.yaml and apply formatting, then commit
  # them to the PR branch (the agent that writes most PRs can't reach npm).
  sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      # The coding agent's sandbox can't reach npm, so it downloads this exact node_modules from
      # a release asset to build and screenshot the UI locally. Keyed by package.json + lockfile.
      - name: Publish node_modules snapshot (dev-cache release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEY=$(cat package.json pnpm-lock.yaml | sha256sum | cut -c1-16)
          NAME="node_modules-linux-x64-$KEY.tar.gz"
          if ! gh release view dev-cache > /dev/null 2>&1; then
            gh release create dev-cache --prerelease --title "dev-cache (CI tooling)" \
              --notes "node_modules snapshots for the coding agent's sandbox, which can't reach npm. Safe to delete."
          fi
          if gh release view dev-cache --json assets -q '.assets[].name' | grep -qx "$NAME"; then
            echo "Snapshot $NAME already published."
          else
            tar -czf "$RUNNER_TEMP/$NAME" node_modules
            ls -lh "$RUNNER_TEMP/$NAME"
            gh release upload dev-cache "$RUNNER_TEMP/$NAME" --clobber
          fi
          # Keep only the three newest snapshots.
          gh release view dev-cache --json assets -q '.assets | sort_by(.createdAt) | reverse | .[3:] | .[].name' |
            while read -r old; do gh release delete-asset dev-cache "$old" --yes; done
      - run: pnpm format
      - name: Commit regenerated files
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Generated files are up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate lockfile and formatting"
          git push

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          else echo "::warning::No pnpm-lock.yaml yet; the sync job will commit one."; pnpm install --no-frozen-lockfile; fi
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Playwright browser
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (iPhone + desktop)
        timeout-minutes: 5
        run: pnpm e2e
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Every Storybook story renders cleanly and passes axe, in light and dark (brief §8).
  stories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          else pnpm install --no-frozen-lockfile; fi
      - run: pnpm build-storybook --quiet
      - name: Playwright browser
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium
      - name: Story tests
        timeout-minutes: 10
        run: pnpm test:stories
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: story-test-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Phase 3's done-when flow against the real API (e2e/accounts.spec.ts): sign up, create a
  # workspace, invite, accept by email, role-restricted access, on iPhone and desktop. The API
  # comes as its arm64 image from ECR, so no cross-repo token is needed: it runs once ECR is set
  # up (vars.ECR_REGISTRY + the AWS key, as for images.yml). The image is sotto/api:main by
  # default (API PRs merge first); a repo variable ACCOUNTS_API_TAG pins another tag.
  accounts:
    if: vars.ECR_REGISTRY != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: sotto
          POSTGRES_PASSWORD: sotto
          POSTGRES_DB: sotto
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sotto -d sotto" --health-interval 5s --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
      # Catches every email (sign-in links, invites); the spec reads them from its API.
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    env:
      API_IMAGE: ${{ vars.ECR_REGISTRY }}/sotto/api:${{ vars.ACCOUNTS_API_TAG || 'main' }}
      DATABASE_URL: postgresql://sotto:sotto@localhost:5432/sotto
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2.1.7
      - name: Start the API (migrations first, as a deploy does)
        timeout-minutes: 5
        # Each failure is also an annotation, readable on the PR without opening the log.
        run: |
          fail() { echo "::error title=accounts::$1"; exit 1; }
          docker pull --quiet "$API_IMAGE" > /dev/null 2>"$RUNNER_TEMP/pull.err" ||
            fail "Couldn't pull $API_IMAGE: $(tail -c 300 "$RUNNER_TEMP/pull.err" | tr '\n' ' ')"
          docker run --rm --network host -e DATABASE_URL "$API_IMAGE" sh scripts/migrate.sh \
            > "$RUNNER_TEMP/migrate.log" 2>&1 ||
            fail "Migrations failed: $(tail -c 400 "$RUNNER_TEMP/migrate.log" | tr '\n' ' ')"
          # Production mode, as deployed: a throwaway secret, and no rate limits for one test run.
          docker run -d --name api --network host \
            -e DATABASE_URL -e REDIS_URL=redis://localhost:6379 -e PORT=4000 \
            -e APP_URL=http://localhost:3000 -e AUTH_SECRET="$(openssl rand -hex 32)" \
            -e AUTH_RATE_LIMIT=off -e SMTP_URL=smtp://localhost:1025 "$API_IMAGE" > /dev/null
          for i in $(seq 1 30); do
            if curl -fsS localhost:4000/healthz > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS localhost:4000/healthz > /dev/null ||
            fail "The API didn't become healthy: $(docker logs api 2>&1 | tail -c 400 | tr '\n' ' ')"
          # sotto/api images before Phase 3 have no sign-in: say so instead of failing later.
          curl -fsS localhost:4000/api/v1/sign-in-methods > /dev/null ||
            fail "$API_IMAGE has no Phase 3 sign-in yet. Merge sotto-api#3 and let its images workflow publish, or set vars.ACCOUNTS_API_TAG."
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      # The build bakes /api/* → localhost:4000 (next.config.ts's default), where the API runs.
      - run: pnpm build
      - name: Playwright browser
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium
      - name: Done-when flow (iPhone + desktop)
        timeout-minutes: 8
        env:
          ACCOUNTS_E2E: '1'
        run: pnpm exec playwright test e2e/accounts.spec.ts
      - name: API logs
        if: failure()
        run: docker logs api
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: accounts-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - run: docker build -t sotto-web:ci .
      - name: Boot the image and probe it
        run: |
          docker run -d --name web -p 3000:3000 -e API_URL=http://127.0.0.1:9 sotto-web:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:3000/healthz && curl -fsS localhost:3000/status | grep -q 'Building in the open'; then exit 0; fi
            sleep 2
          done
          docker logs web; exit 1

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest dir /repo --redact --verbose
