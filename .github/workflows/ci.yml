name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On pull requests from this repo: regenerate pnpm-lock.yaml and apply formatting, then commit
  # them to the PR branch (the agent that writes most PRs can't reach npm).
  sync:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - name: Commit regenerated files
        run: |
          git add -A
          if git diff --cached --quiet; then echo "Generated files are up to date."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate lockfile and formatting"
          git push

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile
          else echo "::warning::No pnpm-lock.yaml yet; the sync job will commit one."; pnpm install --no-frozen-lockfile; fi
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Playwright browser
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (iPhone + desktop)
        timeout-minutes: 5
        run: pnpm e2e
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - run: docker build -t sotto-web:ci .
      - name: Boot the image and probe it
        run: |
          docker run -d --name web -p 3000:3000 -e API_URL=http://127.0.0.1:9 sotto-web:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:3000/healthz && curl -fsS localhost:3000/ | grep -q 'Building in the open'; then exit 0; fi
            sleep 2
          done
          docker logs web; exit 1

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest dir /repo --redact --verbose
